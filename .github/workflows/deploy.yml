name: Build and deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the Actions tab

# Required for OIDC: lets the job request a short-lived identity token from
# GitHub, which Azure exchanges for an access token. No stored passwords.
permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: task-tracker # the App Service's resource name (not its hostname)
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore, build, publish
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet publish --configuration Release --no-build --output ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ./publish

      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Smoke test
        run: |
          HOST=$(az webapp show --name "$AZURE_WEBAPP_NAME" --resource-group rg-task-tracker --query defaultHostName -o tsv)
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "https://$HOST/healthz"; then echo; exit 0; fi
            echo "not up yet, retrying in 20s..."; sleep 20
          done
          echo "health check never passed" && exit 1
