<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#101211">
  <script>
    // Apply the saved theme before first paint so there is no flash. Dark is the default.
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
  <meta name="description" content="A small task tracker running on Azure App Service.">
  <title>Tasks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f6f5c'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main class="shell">

    <header class="top">
      <div class="heading">
        <p class="eyebrow" id="today"></p>
        <h1>Tasks</h1>
      </div>
      <div class="top-actions">
        <div class="user" id="user" hidden>
          <span class="avatar" id="avatar" aria-hidden="true"></span>
          <span class="user-meta">
            <span class="user-name" id="userName"></span>
            <a class="signout" href="/.auth/logout?post_logout_redirect_uri=/">Sign out</a>
          </span>
        </div>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to light theme" title="Switch theme">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <section class="card">

      <div class="progress" aria-live="polite">
        <div class="progress-text">
          <span><strong id="doneCount">0</strong> of <span id="totalCount">0</span> complete</span>
          <span class="percent" id="percent">0%</span>
        </div>
        <div class="bar" role="progressbar" aria-label="Completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
          <span id="barFill"></span>
        </div>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <label class="sr-only" for="newTitle">New task</label>
        <input id="newTitle" type="text" maxlength="200" placeholder="What needs doing?" required>
        <button type="submit" class="add" id="addBtn">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          <span>Add</span>
        </button>
      </form>

      <div class="toolbar">
        <div class="seg" role="group" aria-label="Filter tasks">
          <button type="button" class="seg-btn is-active" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="seg-btn" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" class="seg-btn" data-filter="done" aria-pressed="false">Done</button>
        </div>
        <button type="button" class="ghost" id="clearDone" hidden>Clear completed</button>
      </div>

      <div class="banner" id="banner" role="status" hidden></div>

      <ul class="list" id="list" aria-busy="true" aria-label="Task list"></ul>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/>
          <path d="M15 24.5l6.5 6.5L33 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="empty-title" id="emptyTitle"></p>
        <p class="empty-sub" id="emptySub"></p>
      </div>

    </section>

    <footer class="foot">
      Hosted on Azure App Service &middot; Data in Azure SQL &middot; Sign-in by Microsoft Entra ID
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
